{% if page.copy_group == "projects" %}
  {% assign page_copy = site.data.copy[page.lang].projects[page.copy_key] %}
{% else %}
  {% assign page_copy = site.data.copy[page.lang][page.copy_group] %}
{% endif %}
{% assign meta = page_copy.meta %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ meta.title }}</title>
    <meta name="description" content="{{ meta.description }}" />
    <link rel="canonical" href="{{ site.site_url }}/{{ page.lang }}/{% if page.translation_path != '' %}{{ page.translation_path }}{% endif %}" />
    <link rel="alternate" hreflang="es" href="{{ site.site_url }}/es/{% if page.translation_path != '' %}{{ page.translation_path }}{% endif %}" />
    <link rel="alternate" hreflang="en" href="{{ site.site_url }}/en/{% if page.translation_path != '' %}{{ page.translation_path }}{% endif %}" />
    <link rel="alternate" hreflang="x-default" href="{{ site.site_url }}/en/{% if page.translation_path != '' %}{{ page.translation_path }}{% endif %}" />
    <meta property="og:title" content="{{ meta.title }}" />
    <meta property="og:description" content="{{ meta.description }}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ site.site_url }}/{{ page.lang }}/{% if page.translation_path != '' %}{{ page.translation_path }}{% endif %}" />
    <meta property="og:image" content="{{ site.site_url }}/assets/images/og-default.png" />
    <meta property="og:locale" content="{% if page.lang == 'es' %}es_ES{% else %}en_US{% endif %}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ meta.title }}" />
    <meta name="twitter:description" content="{{ meta.description }}" />
    <meta name="twitter:image" content="{{ site.site_url }}/assets/images/og-default.png" />
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
    <link rel="stylesheet" href="{{ '/assets/css/cookie-banner.css' | relative_url }}">
    <script defer src="{{ '/assets/js/cookie-consent.js' | relative_url }}"></script>
    <script defer src="{{ '/assets/js/cookie-banner.js' | relative_url }}"></script>
    <script defer src="{{ '/assets/js/ga4-consent-loader.js' | relative_url }}"></script>
